<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<title>Phantom AR</title>
</head>

<body style="margin:0;text-align:center;font-family:Arial">

<h2>Ghost Who Walks</h2>

<model-viewer
src="Phantom.glb"
ar
ar-modes="scene-viewer webxr quick-look"
camera-controls
auto-rotate
style="width:100%;height:80vh">

<button slot="ar-button" style="padding:12px;font-size:16px">
View Phantom in your space
</button>

</model-viewer>

</body>
</html>
